[project]
name = "pr-gate"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.118.0",
  "uvicorn[standard]==0.37.0",
  "pydantic==2.11.9",
  "pydantic-settings==2.11.0",
  "httpx==0.28.1",
  "unidiff==0.7.5",
  "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
